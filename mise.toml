[settings]
lockfile = true

[tools]
rust = "latest"
lefthook = "latest"

[tasks.clippy]
run = "cargo clippy --all-targets --locked -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt_check]
run = "cargo fmt --all --check"

[tasks.test]
run = "cargo test --locked"

[tasks.test_update_snapshots]
run = "INSTA_UPDATE=always cargo test --test snapshots --locked"

[tasks.screenshots]
run = "cargo run --example screenshots"

[tasks.banner]
description = "Regenerate docs/banner.svg from the marks in src/."
run = "python3 scripts/banner.py"

[tasks.demo]
description = "Record the README hero GIF via vhs (requires vhs on PATH)."
run = [
    "cargo build --release",
    "vhs docs/demo.tape",
]

[tasks.rename_audit]
description = "List every line where the fork rename turned 'tuxedo' into 'chiba', for review."
run = "python3 scripts/rename-audit.py"

[tasks.upstream]
description = "Report how far behind webstonehq/tuxedo this fork has drifted."
run = "./scripts/upstream-status.sh"

[tasks.upstream_merge]
description = "Merge upstream/main, then run tests and the rename audit."
run = "./scripts/upstream-merge.sh"
